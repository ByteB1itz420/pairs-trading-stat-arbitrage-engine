  <text x="98" y="202" fill="#087f65" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">02 / SCREEN</text>
  <text x="98" y="254" fill="#19332f" font-family="Arial,sans-serif" font-size="42" font-weight="700">Test the relationship, not the story.</text>
  <text x="99" y="294" fill="#75847e" font-family="Arial,sans-serif" font-size="20">Fit and screen on training data before evaluating a held-out period.</text>
