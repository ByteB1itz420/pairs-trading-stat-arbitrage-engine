universe: []

data:
  frequency: daily
  price_field: adjusted_close
  min_observations: 252
  path: data/raw/prices.csv

screening:
  formation_window_days: 252
  engle_granger_significance: 0.05
  adf_significance: 0.05
  multiple_testing_method: benjamini_hochberg
  refit_frequency_days: 21

signals:
  zscore_window_days: 60
  entry_threshold: 2.0
  exit_threshold: 0.5
  stop_threshold: 4.0
  max_holding_days: 30

execution:
  decision_time: close
  fill_time: next_open
  commission_bps_per_side: 2.0
  slippage_bps_per_side: 5.0
  annual_borrow_rate: 0.0
  initial_capital: 100000.0
  gross_exposure_fraction: 1.0

evaluation:
  split_method: chronological
  report_gross_and_net: true
  risk_free_rate_annual: 0.0
  annualization_days: 252
